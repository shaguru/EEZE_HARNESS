[package]
name = "rust-portable-harness"
version = "0.2.0"
edition = "2021"
rust-version = "1.90"

[lib]
name = "harness"
path = "src/lib.rs"

[[bin]]
name = "RustPortableHarness"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["custom-protocol"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
url = "2"
rfd = "0.15"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2.6", default-features = false, features = ["deflate-flate2", "flate2"] }
flate2 = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
